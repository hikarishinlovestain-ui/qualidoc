// ============ COUNT UP ============
function CountUp({ end, decimals = 0, suffix = '' }) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  const inView = useInView(ref, { once: true });

  useEffect(() => {
    if (!inView) return;
    const duration = 2000;
    const startTime = Date.now();
    const interval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setValue(eased * end);
      if (progress >= 1) clearInterval(interval);
    }, 16);
    return () => clearInterval(interval);
  }, [inView, end]);

  return React.createElement('span', { ref }, value.toFixed(decimals) + suffix);
}

                  React.createElement('td', { className: `px-3 py-2 font-mono ${darkMode ? 'text-[#F5E6C8]/70' : 'text-[#2D5016]/70'}` }, r.mic),
                  React.createElement('td', { className: `px-3 py-2 font-mono ${darkMode ? 'text-[#F5E6C8]/70' : 'text-[#2D5016]/70'}` }, r.loec),
                  React.createElement('td', { className: `px-3 py-2 font-bold ${darkMode ? 'text-[#D4A017]' : 'text-[#8B4513]'}` }, r.halo + ' mm')
                ))
              )
            )
          ),
          // Paradox
          React.createElement('div', { className: `p-6 rounded-2xl border-2 ${darkMode ? 'bg-[#D4A017]/10 border-[#D4A017]/50' : 'bg-[#D4A017]/5 border-[#D4A017]/50'}` },
            React.createElement('h3', { className: `font-bold mb-4 text-center text-xl ${darkMode ? 'text-[#C68E17]' : 'text-[#8B4513]'}` }, '⚡ O PARADOXO'),
            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4 text-center' },
              React.createElement('div', null,
                React.createElement('div', { className: 'text-3xl mb-2' }, '🔮'),
                React.createElement('div', { className: `font-semibold ${darkMode ? 'text-[#D4A017]' : 'text-[#8B4513]'}` }, 'Predição In Silico'),
                React.createElement('div', { className: 'text-2xl font-bold text-[#D4A017]' }, '25-30 mm')
              ),
              React.createElement('div', { className: 'flex flex-col justify-center' },
                React.createElement('p', { className: `text-xs ${darkMode ? 'text-[#F5E6C8]/60' : 'text-[#2D5016]/60'}` }, 'Baixa difusividade de lipofílicos no ágar'),
                React.createElement('p', { className: `text-xs mt-2 ${darkMode ? 'text-[#F5E6C8]/60' : 'text-[#2D5016]/60'}` }, 'Halo in silico = proxy matemático')
              ),
              React.createElement('div', null,
                React.createElement('div', { className: 'text-3xl mb-2' }, '🧫'),
                React.createElement('div', { className: `font-semibold ${darkMode ? 'text-[#8B4513]' : 'text-[#8B4513]'}` }, 'Placa Real'),
                React.createElement('div', { className: 'text-2xl font-bold text-[#8B4513]' }, '0 mm')
              )
            )
          )
        )
      ),

      React.createElement('section', { id: 'timeline', className: 'section-block py-20 px-6 relative' },
        React.createElement('div', { className: `absolute inset-0 ${darkMode ? 'bg-gradient-to-b from-[#0a0f07] to-[#141f0d]' : 'bg-gradient-to-b from-[#faf8f0] to-[#f0e4b8]'}` }),
        React.createElement('div', { className: 'relative z-10 max-w-4xl mx-auto' },
          React.createElement('div', { className: 'text-center mb-12' },
            React.createElement('h2', { className: `text-3xl md:text-4xl font-bold mb-4 ${darkMode ? 'text-[#F5E6C8]' : 'text-[#2D5016]'}` }, 'Cronograma'),
            React.createElement('p', { className: `text-lg ${darkMode ? 'text-[#4a7a2e]' : 'text-[#8B4513]'}` }, 'Linha do tempo do doutorado')
          ),
          React.createElement('div', { className: 'relative' },
            React.createElement('div', { className: 'absolute left-6 md:left-1/2 top-0 bottom-0 w-0.5 bg-gradient-to-b from-[#2D5016] via-[#D4A017] to-[#8B4513]' }),
            timelineItems.map((item, i) => {
              const isLeft = i % 2 === 0;
              return React.createElement('div', {
                key: i,
                className: `relative flex items-center mb-6 ${isLeft ? 'md:flex-row' : 'md:flex-row-reverse'} flex-row`
              },
                React.createElement('div', { className: `flex-1 ml-14 md:ml-0 ${isLeft ? 'md:pr-12 md:text-right' : 'md:pl-12 md:text-left'}` },
                  React.createElement('div', {
                    className: `inline-block p-4 rounded-xl border ${item.status === 'current' ? 'animate-pulse-glow border-[#D4A017] bg-[#D4A017]/10' : item.status === 'done' ? (darkMode ? 'bg-[#1a2b12]/60 border-[#2D5016]/30' : 'bg-white/60 border-[#2D5016]/20') : (darkMode ? 'bg-[#1a2b12]/30 border-[#2D5016]/15' : 'bg-white/30 border-[#2D5016]/10')}`
                  },
                    React.createElement('div', { className: `text-xs font-mono mb-1 ${item.status === 'current' ? 'text-[#D4A017]' : darkMode ? 'text-[#4a7a2e]' : 'text-[#2D5016]'}` }, item.period),
                    React.createElement('div', { className: `font-semibold text-sm ${item.status === 'current' ? 'text-[#D4A017]' : darkMode ? 'text-[#F5E6C8]' : 'text-[#2D5016]'}` }, item.icon, ' ', item.title),
                    item.status === 'done' && React.createElement('span', { className: 'text-xs text-[#4a7a2e]' }, '✅ Concluído'),
                    item.status === 'future' && React.createElement('span', { className: `text-xs ${darkMode ? 'text-[#F5E6C8]/40' : 'text-[#2D5016]/40'}` }, '⏳ Futuro')
                  )
                ),
                React.createElement('div', {
                  className: `absolute left-6 md:left-1/2 w-4 h-4 rounded-full -translate-x-1/2 border-2 ${item.status === 'current' ? 'bg-[#D4A017] border-[#D4A017] scale-150' : item.status === 'done' ? 'bg-[#2D5016] border-[#4a7a2e]' : 'bg-transparent border-[#2D5016]/40'}`
                }),
                React.createElement('div', { className: 'hidden md:block flex-1' })
              );
            })
          )
        )
      ),

      // BLOCK 9: CONCLUSIONS
      React.createElement('section', { id: 'conclusions', className: 'section-block py-20 px-6 relative' },
        React.createElement('div', { className: `absolute inset-0 ${darkMode ? 'bg-gradient-to-b from-[#141f0d] to-[#0a0f07]' : 'bg-gradient-to-b from-[#f0e4b8] to-[#faf8f0]'}` }),
        React.createElement('div', { className: 'relative z-10 max-w-5xl mx-auto' },
          React.createElement('div', { className: 'text-center mb-12' },
            React.createElement('h2', { className: `text-3xl md:text-4xl font-bold mb-4 ${darkMode ? 'text-[#F5E6C8]' : 'text-[#2D5016]'}` }, 'Conclusões Preliminares'),
            React.createElement('p', { className: `text-lg ${darkMode ? 'text-[#4a7a2e]' : 'text-[#8B4513]'}` }, 'Principais achados desta investigação')
          ),
          React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6 mb-12' },
            [
              { icon: '✅', title: 'Dualidade Fitoquímica', desc: 'HT = sinalizador | BM = nutricional', status: 'confirmed' },
              { icon: '✅', title: 'Hormese do Trub Quente', desc: 'Pico 12,5 mg/L | EC50 ~45-63 mg/L', status: 'confirmed' },
              { icon: '✅', title: 'Saturação do Bagaço', desc: 'EC50 >3600 mg/L | Sem toxicidade', status: 'confirmed' },
              { icon: '⚠️', title: 'Antifúngico', desc: 'Requer microdiluição em meio líquido', status: 'warning' }
            ].map((c, i) => React.createElement('div', {
              key: i,
              className: `card-hover p-6 rounded-2xl border-2 ${c.status === 'confirmed' ? (darkMode ? 'bg-[#2D5016]/20 border-[#2D5016]/40' : 'bg-[#2D5016]/5 border-[#2D5016]/30') : (darkMode ? 'bg-[#D4A017]/10 border-[#D4A017]/40' : 'bg-[#D4A017]/5 border-[#D4A017]/30')}`
            },
              React.createElement('div', { className: 'flex items-start gap-4' },
                React.createElement('span', { className: 'text-4xl' }, c.icon),
                React.createElement('div', null,
                  React.createElement('h3', { className: `font-bold text-lg mb-2 ${darkMode ? 'text-[#F5E6C8]' : 'text-[#2D5016]'}` }, c.title),
                  React.createElement('p', { className: `text-sm ${darkMode ? 'text-[#F5E6C8]/70' : 'text-[#8B4513]/80'}` }, c.desc)
                )
              )
            ))
          ),
          React.createElement('div', { className: 'text-center' },
            React.createElement('div', {
              className: `inline-block p-8 rounded-3xl border-2 ${darkMode ? 'bg-gradient-to-br from-[#1a2b12] to-[#141f0d] border-[#D4A017]/30' : 'bg-gradient-to-br from-white to-[#F5E6C8] border-[#D4A017]/30'}`
            },
              React.createElement('div', { className: 'text-5xl mb-4' }, '🌱'),
              React.createElement('h3', { className: `text-xl font-bold mb-3 ${darkMode ? 'text-[#D4A017]' : 'text-[#8B4513]'}` }, 'Do resíduo ao bioinsumo'),
              React.createElement('p', { className: `text-sm max-w-md mx-auto ${darkMode ? 'text-[#F5E6C8]/70' : 'text-[#2D5016]/70'}` },
                'Esta pesquisa demonstra que resíduos da indústria cervejeira podem ser transformados em bioinsumos de alto valor agregado, alinhando economia circular com inovação agronômica.'
              ),
              React.createElement('div', { className: `mt-4 text-xs ${darkMode ? 'text-[#4a7a2e]' : 'text-[#2D5016]/50'}` }, 'ODS 12 • Consumo e Produção Responsáveis')
            )
          )
        )
      )
    ),

    // Footer
    React.createElement('footer', { className: `py-8 text-center text-sm ${darkMode ? 'text-[#4a7a2e]' : 'text-[#2D5016]'}` },
      React.createElement('p', null, 'Painel de Qualificação de Doutorado — Outubro 2026'),
      React.createElement('p', { className: 'mt-1 text-xs opacity-60' },
        'Pressione ', React.createElement('kbd', { className: 'px-1 py-0.5 rounded border border-current' }, 'F'), ' para modo apresentação | ',
        React.createElement('kbd', { className: 'px-1 py-0.5 rounded border border-current ml-1' }, 'D'), ' para alternar tema'
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
